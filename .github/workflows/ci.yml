name: Olist MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Format and Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/api.txt ruff==0.17.3
          python -m pip check

      - name: Ruff lint
        run: python -m ruff check --select E4,E7,E9,F app src scripts tests

      - name: Ruff format
        run: python -m ruff format --check app src scripts tests

      - name: Regression tests
        run: python -m pytest -q tests

  docker-build:
    name: Build Docker Image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image without publishing
        run: docker build --pull --tag olist-inference:ci .
